<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#18232d"><meta name="description" content="帧间，专注照片本身的选片工作台。查看、入选、记录与导出。"><title>帧间 FRAME · 冰岛地貌观察</title><link rel="stylesheet" href="style.css"><script src="data.js" defer></script><script src="app.js" defer></script></head>
<body><a class="skip" href="#workspace">跳到照片</a>
<header class="topbar"><div class="brand"><span class="brandmark" aria-hidden="true"></span><strong>帧间</strong><span>FRAME</span></div><nav aria-label="照片范围"><button id="all-tab" class="nav-tab active" aria-pressed="true">全部照片 <span>8</span></button><button id="selected-tab" class="nav-tab" aria-pressed="false">已入选 <span id="selected-count">0</span></button></nav><div class="top-actions"><button id="export" class="outline export" disabled title="下载包含照片来源和笔记的 JSON 清单">导出 JSON <span aria-hidden="true">↓</span></button></div></header>
<main id="workspace"><section class="album-bar" aria-label="相册与筛选"><div class="album-title"><h1>冰岛 · 地貌观察</h1><p>ICELAND / A LANDSCAPE STUDY</p></div><div class="filters"><label class="search"><span aria-hidden="true">⌕</span><input id="search" type="search" aria-label="搜索照片名称或编号" placeholder="搜索照片或编号"></label><label class="category"><span class="sr-only">照片分类</span><select id="category"><option value="all">全部分类</option><option>海岸</option><option>山野</option><option>瀑布</option></select></label><button id="view-toggle" class="outline" aria-pressed="false"><span aria-hidden="true">▦</span> 总览</button></div></section>
<div id="save-error" class="error-banner" role="alert" hidden><span id="error-text"></span><button id="retry">重试保存</button></div>
<section id="stage" class="stage" aria-label="单张检视"><div class="viewer"><div class="viewer-top"><span>单张检视</span><button id="expand" class="glass" aria-label="放大查看当前照片">放大 <span aria-hidden="true">⛶</span></button></div><button id="previous" class="arrow previous" aria-label="上一张照片">‹</button><button id="image-open" class="image-open" aria-label="放大查看潮线"><img id="hero" src="assets/C10-122459580.jpg" alt="潮线" fetchpriority="high"></button><button id="next" class="arrow next" aria-label="下一张照片">›</button><div class="viewer-bottom"><span>完整构图</span><span id="image-position">01 / 08</span></div></div>

<section id="grid-view" class="grid-view" aria-label="照片总览" hidden></section>
<section id="empty" class="empty" hidden><span class="empty-mark" aria-hidden="true">[　]</span><h2 id="empty-title">没有匹配的照片</h2><p id="empty-copy">换个关键词，或回到全部照片继续浏览。</p><button id="reset-filters" class="pick">查看全部照片</button></section>
<section id="filmstrip" class="filmstrip" aria-label="照片序列"><div class="strip-heading"><h2>照片序列 <span id="visible-count">8 张</span></h2></div><div id="thumbnails" class="thumbnails"></div></section>
<footer><div class="shortcuts"><span><kbd>←</kbd><kbd>→</kbd> 切换</span><span><kbd>P</kbd> 入选</span><span><kbd>空格</kbd> 放大</span><span><kbd>G</kbd> 总览</span></div><span id="save-status" role="status">选择保存在此浏览器</span></footer></main>
<dialog id="lightbox" aria-labelledby="lightbox-title"><div class="lightbox-bar"><h2 id="lightbox-title">潮线</h2><button id="close-lightbox" class="outline" aria-label="关闭大图">关闭 <kbd>Esc</kbd></button></div><img id="lightbox-image" src="assets/C10-122459580.jpg" alt="潮线，完整摄影"><div class="lightbox-bottom"><button id="lightbox-prev" class="outline">← 上一张</button><span id="lightbox-count"></span><button id="lightbox-next" class="outline">下一张 →</button></div></dialog>
<div id="toast" role="status" class="toast" hidden></div><noscript>请启用 JavaScript，以查看照片和使用选片功能。</noscript></body></html>
