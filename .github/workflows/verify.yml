name: Verify and package
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run check
      - run: python -m unittest discover -s plugins/codex-lly-ui/skills/codex-lly-ui/tests
      - run: python scripts/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: codex-lly-ui
          path: dist/*.zip
